name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test integrations/oidc (separate module)
        run: go test ./...
        working-directory: integrations/oidc

  uitest:
    # Browser-level UI tests (uitest/ is a separate module; drives the
    # ubuntu runner's preinstalled Chrome headlessly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: uitest/go.mod
          cache: true
          cache-dependency-path: uitest/go.sum
      - name: UI tests
        run: go test ./...
        working-directory: uitest
